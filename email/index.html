<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one service-manual plate. Header + deployment and scenario switches, a mail-path rail, then three panels (message · classifiers · mailbox), then the step caption. */
:root{
  --paper:#EBEEF2; --panel:#F8F9FB; --screen:#FFFFFF; --ink:#17202B; --soft:#5B6676; --line:#C9D0D9; --grid:#DCE1E8; --chip:#EEF0F3;

  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D131B; --panel:#141C26; --screen:#1A2330; --ink:#DCE3EC; --soft:#8C99AA; --line:#2B3747; --grid:#222D3A; --chip:#222D3A;
  --accent:#7F95FF; --accentS:#26315A; --risk:#FF6A5C; --riskS:#4A1F1C; --ok:#4CC38A; --okS:#173828; --warn:#E3A548; --warnS:#45331A; --onAccent:#0D131B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D131B; --panel:#141C26; --screen:#1A2330; --ink:#DCE3EC; --soft:#8C99AA; --line:#2B3747; --grid:#222D3A; --chip:#222D3A;
  --accent:#7F95FF; --accentS:#26315A; --risk:#FF6A5C; --riskS:#4A1F1C; --ok:#4CC38A; --okS:#173828; --warn:#E3A548; --warnS:#45331A; --onAccent:#0D131B; color-scheme:dark}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-inline:24px;padding-block:22px 36px;display:grid;gap:14px}
@media (max-width:600px){.wrap{padding-inline:16px}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
h1{margin:0;font:700 clamp(30px,4vw,40px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--soft);text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:transparent;color:var(--soft);font:600 13px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.sc button.bad[aria-pressed="true"]{background:var(--risk);color:var(--onAccent)}
.seg.sc button.good[aria-pressed="true"]{background:var(--ok);color:var(--onAccent)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.btn{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent);min-width:76px}
/* Back-to-home button — subtle circular arrow matching the Alliances page; sits inline in the toolbar. */
.back{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--soft);text-decoration:none;transition:color .2s,border-color .2s}
.back:hover{color:var(--ink);border-color:var(--soft)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepno{font:500 12px var(--f-mono);color:var(--soft);letter-spacing:.06em;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.bar.b i{background:var(--risk)}
.stage{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:0}
.stage svg{display:block;width:100%;min-width:980px;height:auto}

/* svg */
svg text{font-family:var(--f-body);fill:var(--ink)}
svg .mono{font-family:var(--f-mono)}
.gridline{stroke:var(--grid);fill:none}
.colhd{font:600 10px var(--f-mono);letter-spacing:.12em;fill:var(--soft)}
.ts{fill:var(--soft)} .ta{fill:var(--accent)} .tr{fill:var(--risk)} .tok{fill:var(--ok)} .twn{fill:var(--warn)} .tw{fill:var(--onAccent)}
.card{fill:var(--screen);stroke:var(--line)}
.pnl{fill:var(--panel);stroke:var(--line)}
.skel{fill:var(--chip)}

/* rail */
.node{transition:transform .7s cubic-bezier(.6,0,.3,1)}

.node.pp .nbox{stroke:var(--accent);stroke-width:1.6}
.node.on .nbox{fill:var(--accentS);stroke:var(--accent);stroke-width:2}
.node.risk .nbox{fill:var(--riskS);stroke:var(--risk);stroke-width:2}
.node.okk .nbox{fill:var(--okS);stroke:var(--ok);stroke-width:2}
.ntitle{font-size:14px;font-weight:700}

.edge{stroke:var(--soft);stroke-width:1.5;fill:none}

.arrowh{fill:var(--soft)}
.flow{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;animation:dash 1s linear infinite;stroke:var(--accent)}
.flow.k-risk{stroke:var(--risk);stroke-width:3}
.flow.k-ok{stroke:var(--ok)}

.pk{fill:var(--accent)} .pk.k-risk{fill:var(--risk)} .pk.k-ok{fill:var(--ok)}
.pkh{fill:var(--accent);opacity:.22} .pkh.k-risk{fill:var(--risk)} .pkh.k-ok{fill:var(--ok)}
.blockc{fill:var(--risk)}

/* message parts */
.part{fill:transparent;stroke:transparent;stroke-width:1.4;transition:fill .3s,stroke .3s}
.part.q{stroke:var(--accent);stroke-dasharray:3 3}
.part.scan{fill:var(--accentS);stroke:var(--accent)}
.part.pass{fill:var(--okS);stroke:var(--ok)}
.part.warn{fill:var(--warnS);stroke:var(--warn)}
.part.flag{fill:var(--riskS);stroke:var(--risk)}
.linkbtn{fill:var(--accent)}
.docicon{fill:var(--screen);stroke:var(--soft)} .docline{stroke:var(--soft);stroke-width:1.4}

/* classifier rows */
.crow{fill:transparent;stroke:transparent;transition:fill .25s,stroke .25s}
.crow.scan{fill:var(--accentS);stroke:var(--accent)}
.crow.flag{fill:var(--riskS)}
.crow.warn{fill:var(--warnS)}
.st{fill:var(--panel);stroke:var(--line);stroke-width:2;transition:fill .25s,stroke .25s}
.st.queued{stroke:var(--accent);stroke-dasharray:3 3}
.st.scan{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:24 12;transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.st.pass{fill:var(--ok);stroke:var(--ok)}
.st.warn{fill:var(--warn);stroke:var(--warn)}
.st.flag{fill:var(--risk);stroke:var(--risk)}
.st.na{fill:var(--panel);stroke:var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}
.chipr{fill:none;stroke:none}
.chipr.scan{fill:var(--accent)} .chipr.pass{fill:var(--ok)} .chipr.warn{fill:var(--warn)} .chipr.flag{fill:var(--risk)} .chipr.na{fill:var(--chip)}
.chipt{font:600 9.5px var(--f-mono);letter-spacing:.06em;fill:var(--onAccent)}
.chipt.na{fill:var(--soft)}
.ld{fill:none;stroke-width:1.6;transition:opacity .25s}
.ld.q{stroke:var(--accent);stroke-dasharray:3 4;opacity:.55}
.ld.scan{stroke:var(--accent);stroke-width:2.2}
.ld.pass{stroke:var(--ok)} .ld.warn{stroke:var(--warn)} .ld.flag{stroke:var(--risk);stroke-width:2.2}
.ldd{transition:opacity .25s}
.ldd.q,.ldd.scan{fill:var(--accent)} .ldd.pass{fill:var(--ok)} .ldd.warn{fill:var(--warn)} .ldd.flag{fill:var(--risk)}
.sbar{fill:var(--grid)}
.sfill{fill:var(--ok)} .sfill.bad{fill:var(--risk)}
.thr{stroke:var(--ink);stroke-width:1.5}

/* mailbox */
.mrow{fill:var(--screen);stroke:var(--line)}
.avatar{fill:var(--chip)}
.newrow{transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .4s}
.newrow.instant{transition:none}
.newrow .mrow{fill:var(--accentS);stroke:var(--accent)}
.newrow.risk .mrow{fill:var(--riskS);stroke:var(--risk);stroke-width:1.6}
.newrow.okk .mrow{fill:var(--okS);stroke:var(--ok)}
.unread{fill:var(--accent)} .newrow.risk .unread{fill:var(--risk)} .newrow.okk .unread{fill:var(--ok)}
.others{transition:transform .9s cubic-bezier(.6,0,.3,1)}
.qbox{fill:var(--screen);stroke:var(--line);transition:stroke .3s}
.qbox.alert{stroke:var(--risk);stroke-width:1.6}
.slot{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.pop{animation:pop .45s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .flow,.st.scan,.pop,.edges{animation:none}
  .node,.newrow,.others{transition:none}
}
</style>

 clean:{tag:'Clean',score:4,

/* ---------- message card (per scenario) ---------- */
let parts={},partAnchor={};
function buildMsg(){

function partOf(id){const sc=SC[scen];if(sc.partOv&&sc.partOv[id])return sc.partOv[id];const p=PART0[id];
  if(p==='link'&&!sc.email.link)return null;if(p==='att'&&!sc.email.att)return null;return p}

/* ---------- state ---------- */
let mode='gw',scen='phish',cur=0,playing=!reduce,t0=performance.now(),anims=[],packets=[],lastMode=null;
const steps=()=>STEPS[mode];

function railPath(a,b){const P=POS[mode];const xa=P[a],xb=P[b];const d=xb>xa?1:-1;return `M${xa+d*100} ${RY} L${xb-d*100} ${RY}`}

function render(n){
  const S=steps(),id=S[n],sc=SC[scen],bad=sc.score>=70,API=mode==='api';
  const at=k=>S.indexOf(k),reached=k=>at(k)>=0&&at(k)<=n;
  anims=[];packets=[];
  const now=performance.now();

  /* rail */
  nodeSub.pp.textContent=API?'API · post-delivery':'secure email gateway';
  for(const k in nodeEl){nodeEl[k].style.transform=`translate(${POS[mode][k]}px,0)`;nodeEl[k].setAttribute('class','node'+(k==='pp'?' pp':''))}
  if(lastMode!==mode){edgeG.innerHTML='';const eg=g(lastMode&&!reduce?'edges':null,edgeG);
    EDGES[mode].forEach(([a,b,lab,both])=>{e('path',{d:railPath(a,b),class:'edge'+(both?' dash':''),'marker-end':'url(#ah)','marker-start':both?'url(#ah)':''},eg);
      if(lab){const xm=(POS[mode][a]+POS[mode][b])/2;e('text',{x:xm,y:RY-10,'font-size':10.5,class:'ts mono','text-anchor':'middle'},eg,lab)}});
    lastMode=mode}
  const on=(k,c)=>nodeEl[k].classList.add(c||'on');
  railFx.innerHTML='';railPk.innerHTML='';railMark.innerHTML='';
  const flows=[];
  if(id==='send')on('net');
  if(id==='route'){on('pp');flows.push({d:railPath('net','pp'),k:'req'})}
  if(id==='land'){on('inbox');flows.push({d:`M${POS.api.net+100} ${RY} L${POS.api.inbox-100} ${RY}`,k:'req',dur:2000})}
  if(id==='api'){on('pp');flows.push({d:railPath('inbox','pp'),k:'req'})}
  if(['unpack','identity','content','verdict'].includes(id)){on('pp');if(API&&reached('land'))on('inbox')}
  if(reached('act')){
    if(!bad){on('inbox','okk');if(id==='act'&&!API)flows.push({d:`M${POS.gw.pp+100} ${RY} L${POS.gw.inbox-100} ${RY}`,k:'ok',dur:2000});if(API)on('pp')}
    else if(!API){on('pp','risk');const xm=(POS.gw.pp+POS.gw.m365)/2,bg=g(id==='act'&&!reduce?'pop':null,railMark);
      e('circle',{cx:xm,cy:RY,r:13,class:'blockc'},bg);e('path',{d:`M${xm-5} ${RY-5}l10 10M${xm+5} ${RY-5}l-10 10`,style:'stroke:var(--onAccent);stroke-width:2.4'},bg);
      e('text',{x:xm,y:RY+34,'font-size':11,'font-weight':700,class:'tr','text-anchor':'middle'},bg,'BLOCKED')}
    else{on('inbox','risk');on('pp','risk');if(id==='act')flows.push({d:railPath('inbox','pp'),k:'risk'});
      const xm=(POS.api.inbox+POS.api.pp)/2;e('text',{x:xm,y:RY+30,'font-size':11,'font-weight':700,class:'tr','text-anchor':'middle'},railMark,'PULLED')}
  }
  flows.forEach(p=>{e('path',{d:p.d,class:'flow k-'+p.k},railFx);if(reduce)return;
    const path=e('path',{d:p.d,fill:'none',stroke:'none'},railPk);
    const halo=e('circle',{r:12,class:'pkh k-'+p.k,opacity:0},railPk);
    const dot=g(null,railPk);dot.setAttribute('opacity',0);
    e('rect',{x:-9,y:-6,width:18,height:12,rx:2,class:'pk k-'+p.k},dot);e('path',{d:'M-9 -6 L0 1 L9 -6',style:'fill:none;stroke:var(--onAccent);stroke-width:1.3'},dot);
    packets.push({path,len:path.getTotalLength(),halo,dot,delay:300,dur:p.dur||1500})});

  /* message pop on send */
  msgG.setAttribute('class',id==='send'&&!reduce?'pop':'');
  ppNote.textContent=API?'reading via API':'inline in the mail path';

  /* classifiers */
  const grpStep=['identity','content'];
  function state(i,el){const c=CL[i],gs=grpStep[c.g];
    if(!reached('unpack'))return {s:'idle'};
    if(!reached(gs))return {s:'queued'};
    const res=sc.r[c.id];
    if(id!==gs)return {s:res[0],done:1};
    const k=CL.filter(x=>x.g===c.g).indexOf(c),s0=500+k*1000;
    if(el<s0)return {s:'queued'};if(el<s0+650)return {s:'scan',live:1};
    return {s:res[0],live:el<s0+1300,done:1}}
  function applyCls(el){
    const ps={};
    rows.forEach((r,i)=>{const st=state(i,el),s=st.s,res=sc.r[r.c.id];
      r.box.setAttribute('class','crow'+(s==='scan'?' scan':s==='flag'?' flag':s==='warn'?' warn':''));
      r.st.setAttribute('class','st '+s);
      if(st.done){r.sub.textContent=res[1];r.sub.setAttribute('class',s==='pass'?'tok':s==='warn'?'twn':s==='flag'?'tr':'ts');r.sub.setAttribute('font-weight',s==='na'?400:600)}
      else{r.sub.textContent=r.c.prop;r.sub.setAttribute('class','ts mono');r.sub.setAttribute('font-weight',400)}
      r.cr.setAttribute('class','chipr '+(CHIP[s]?s:''));r.ct.textContent=CHIP[s]||'';r.ct.setAttribute('class','chipt'+(s==='na'?' na':''));
      // leaders
      if(r.ld){let lc=null;
        if(id==='unpack'&&(reduce||el>400+i*220))lc='q';
        else if(st.live)lc=s;
        else if(id==='summary'&&st.done&&(bad?(s==='flag'||s==='warn'):s==='pass'))lc=s;
        r.ld.setAttribute('class','ld '+(lc||''));r.ld.setAttribute('opacity',lc?1:0);
        r.ldd.setAttribute('class','ldd '+(lc||''));r.ldd.setAttribute('opacity',lc?1:0);
        // part state
        if(reached('unpack')){const prev=ps[r.part];
          let v=st.done?s:(s==='scan'?'scan':'q');
          if(id==='unpack')v=(reduce||el>400+i*220)?'scan':null;
          if(v==='na')v='q';
          const rank=x=>x==null?-1:x==='q'?0:x==='scan'?1.5:RANK[x];
          if(prev===undefined||rank(v)>rank(prev))ps[r.part]=v}}
    });
    for(const k in parts)parts[k].setAttribute('class','part '+(ps[k]||''));
  }
  applyCls(reduce?1e9:0);anims.push(applyCls);

  /* score */
  const setScore=f=>{sFill.setAttribute('width',458*f*sc.score/100);sFill.setAttribute('class','sfill'+(bad?' bad':''))};
  const showVer=v=>{if(v){verT.textContent=(bad?'⚠  ':'✓  ')+sc.tag.toUpperCase();verT.setAttribute('class',bad?'tr':'tok');scoreT.textContent='score '+sc.score+' / 100'}
    else{verT.textContent=reached('unpack')?'COLLECTING SIGNALS…':'WAITING';verT.setAttribute('class','ts');scoreT.textContent=''}};
  if(!reached('verdict')){setScore(0);showVer(false)}
  else if(id==='verdict'&&!reduce){setScore(0);showVer(false);anims.push(el=>{setScore(ease(Math.max(0,Math.min(1,(el-300)/1500))));showVer(el>1900)})}
  else{setScore(1);showVer(true)}

  /* mailbox */
  let where=null;
  if(API){if(reached('land'))where=(bad&&reached('act'))?'q':'inbox'}
  else if(reached('act'))where=bad?'q':'inbox';
  const instant=!API&&where==='q';
  newRow.classList.toggle('instant',instant||reduce);
  newRow.style.transform=`translate(0px,${where==='q'?QY-SLOT(0):0}px)`;
  newRow.style.opacity=where?1:0;
  newRow.classList.toggle('risk',bad&&(where==='q'||(API&&reached('verdict'))));
  newRow.classList.toggle('okk',!bad&&reached('act'));
  others.style.transform=`translate(0px,${where==='inbox'?42:0}px)`;
  let iN='',iC='ts';
  if(!API){if(reached('route')&&!reached('act')){iN='Nothing yet. The message is still at the gateway.'}
    else if(reached('act')){iN=bad?'Never delivered. Nothing here for Jane to click.':'✓ Delivered. Jane sees normal mail.';iC=bad?'tr':'tok'}}
  else{if(reached('land')&&!reached('act')){iN=bad&&reached('verdict')?'Flagged. Still in the inbox, about to be pulled.':'Delivered. Jane can open it right now.';iC=bad&&reached('verdict')?'tr':'ta'}
    else if(reached('act')){iN=bad?'Pulled. Gone from Jane’s inbox.':'✓ Inspected and left in place.';iC=bad?'tr':'tok'}}
  inboxNote.textContent=iN;inboxNote.setAttribute('class',iC);
  qbox.setAttribute('class','qbox'+(where==='q'?' alert':''));
  if(where==='q'){qNote1.textContent='⚠  '+sc.tag;qNote1.setAttribute('class','tr');
    qNote2.textContent=API?'Removed over the API, from every mailbox':'Held at the gateway. Microsoft 365';
    qNote3.textContent=API?'it reached. Nothing left to click.':'never received it.'}
  else{qNote1.textContent='Empty';qNote1.setAttribute('class','ts');qNote2.textContent='Messages the verdict stops end up here.';qNote3.textContent=''}

  /* chrome */
  document.getElementById('stepno').textContent='Step '+String(n+1).padStart(2,'0')+' / '+S.length;
  const bar=document.getElementById('bar');bar.classList.toggle('b',bad&&reached('verdict'));bar.firstElementChild.style.width=((n+1)/S.length*100)+'%';
  t0=now;
}


/* ---------- controls ---------- */
const playBtn=document.getElementById('play');
function setPlaying(v){playing=v;playBtn.textContent=v?'Pause':'Play';t0=performance.now()}
function go(n){cur=Math.max(0,Math.min(steps().length-1,n));render(cur)}
function setMode(m){if(m===mode)return;const idNow=steps()[cur];mode=m;
  ['gw','api'].forEach(k=>document.getElementById('m-'+k).setAttribute('aria-pressed',k===m));
  let i=steps().indexOf(idNow);if(i<0)i=Math.min(cur,steps().length-1);go(i)}
function setScen(s){scen=s;['clean','phish','bec','mal'].forEach(k=>document.getElementById('s-'+k).setAttribute('aria-pressed',k===s));buildMsg();go(0);setPlaying(!reduce)}
document.getElementById('m-gw').onclick=()=>setMode('gw');
document.getElementById('m-api').onclick=()=>setMode('api');
['clean','phish','bec','mal'].forEach(k=>document.getElementById('s-'+k).onclick=()=>setScen(k));
playBtn.onclick=()=>{if(!playing&&cur===steps().length-1)go(0);setPlaying(!playing)};
document.getElementById('restart').onclick=()=>{go(0);setPlaying(true)};
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'){setPlaying(false);go(cur+1)}else if(ev.key==='ArrowLeft'){setPlaying(false);go(cur-1)}});

function tick(now){
  const el=now-t0;
  if(!reduce)anims.forEach(f=>f(el));
  packets.forEach(p=>{const t=(el-p.delay)/p.dur;
    if(t<0||t>1){p.dot.setAttribute('opacity',0);p.halo.setAttribute('opacity',0);return}
    const pt=p.path.getPointAtLength(ease(t)*p.len);
    p.dot.setAttribute('transform',`translate(${pt.x},${pt.y})`);p.halo.setAttribute('cx',pt.x);p.halo.setAttribute('cy',pt.y);
    p.dot.setAttribute('opacity',1);p.halo.setAttribute('opacity',1)});
  const dur=DUR[steps()[cur]]||4200;
  if(playing&&el>dur){if(cur<steps().length-1)go(cur+1);else setPlaying(false)}
  requestAnimationFrame(tick);
}
buildMsg();setPlaying(playing);go(0);requestAnimationFrame(tick);
})();
