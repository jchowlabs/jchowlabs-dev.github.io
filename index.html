<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jchowlabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       jchowlabs — home (prototype directory), dark theme
       A "Tools" header + subtle divider over a vertical list of rows.
       Each row is a numbered circle + title + description + arrow.
       Add one: copy an <a class="card"> block and renumber.
       ============================================================ */
    :root {
      color-scheme: dark;
      --ink: #e6e8ec;
      --muted: #98a0b3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1c2230;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
    }

    .wrap { width: min(480px, 100%); transform: translateY(-13vh); }

    /* ── Header ────────────────────────────────────────────────── */
    .head { text-align: center; margin-bottom: 32px; }
    .head h1 {
      margin: 0;
      font-size: clamp(1.95rem, 4.6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      line-height: 1;
    }
    /* Subtle divider: a little wider than the column (centered on the viewport, so it
       can exceed the 540px column), fading over the outer ~20% on each side */
    .head-rule {
      width: min(540px, 90vw);
      height: 1px;
      margin: 20px 0 0;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14) 20%, rgba(255,255,255,.14) 80%, transparent);
    }

    /* ── Vertical list of tool rows ────────────────────────────── */
    .list { display: flex; flex-direction: column; gap: 14px; }

    .card {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, .028);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(120, 170, 240, .40);
      background: rgba(255, 255, 255, .045);
      box-shadow: 0 18px 42px rgba(0, 0, 0, .30);
    }
    .card:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }

    /* Numbered circle (mirrors the "how it works" step markers in alliances) */
    .num {
      flex: none;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(230, 232, 236, .45);
      display: grid; place-items: center;
      font-size: .95rem; font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      transition: border-color .22s ease;
    }
    .card:hover .num { border-color: rgba(230, 232, 236, .8); }

    .meta { flex: 1 1 auto; min-width: 0; }
    .meta h2 {
      margin: 0;
      font-size: clamp(.95rem, 2.4vw, 1.05rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .meta p { margin: 3px 0 0; font-size: clamp(.8rem, 2vw, .86rem); color: var(--muted); line-height: 1.4; }

    .arrow { flex: none; width: 22px; height: 22px; color: var(--muted); transition: transform .22s ease, color .22s ease; }
    .card:hover .arrow { color: var(--ink); transform: translateX(4px); }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 560px) {
      body { padding: 40px 16px; }
      .head { margin-bottom: 24px; }
      .card { gap: 13px; padding: 11px 15px; }
      .num { width: 34px; height: 34px; font-size: .9rem; }
      .arrow { width: 19px; height: 19px; }
    }
    @media (max-height: 640px) { body { justify-content: flex-start; } .wrap { transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .card, .arrow, .num { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">

    <header class="head">
      <h1>Tools</h1>
      <div class="head-rule" aria-hidden="true"></div>
    </header>

    <nav class="list">

      <!-- Proofpoint Alliances ───────────────────────────────────── -->
      <a class="card" href="alliances/">
        <span class="num" aria-hidden="true">1</span>
        <div class="meta">
          <h2>Proofpoint Alliances</h2>
          <p>Alliance tools and resources.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Proofpoint Teacher ─────────────────────────────────────── -->
      <a class="card" href="teacher/">
        <span class="num" aria-hidden="true">2</span>
        <div class="meta">
          <h2>Proofpoint Teacher</h2>
          <p>Teaching and training tools for Proofpoint.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Falcon Deck ────────────────────────────────────────────── -->
      <a class="card" href="falcon/">
        <span class="num" aria-hidden="true">3</span>
        <div class="meta">
          <h2>Falcon Deck</h2>
          <p>Presentation and deck tools.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Add the next tool by copying a card block above and renumbering. -->

    </nav>

  </main>
</body>
</html>
