<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>jchowlabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       jchowlabs — home (prototype directory), dark theme.
       A grid of tiles, ported from the Alliances home pattern:
       each tile is a numbered index label (top-left) + a centered
       title. Tiles flow left-to-right, then wrap down — 3 across on
       desktop, 2 on tablet, 1 on mobile.
       Add one: copy an <a class="tile"> (real page) or a
       <div class="tile"> (not-yet-built placeholder) and bump the number.
       Wire up a placeholder: change its <div class="tile"> to
       <a class="tile" href="…/">.
       ============================================================ */
    :root {
      color-scheme: dark;
      --bg: #1c2230;
      --surface: #252c3d;
      --ink: #e6e8ec;
      --ink-2: #a7b0c2;
      --ink-3: #7c879c;
      --line: #343e52;
      --accent: #5c9ced;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.18);
      --f-display: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-display);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    /* Centered content column (mirrors .wrap in Alliances) */
    .wrap { max-width: 700px; margin-inline: auto; padding: 0 20px 64px; }

    /* ── Header ────────────────────────────────────────────────── */
    .home-head { padding-block: 56px 24px; }
    .home-head h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 700;
      letter-spacing: -.022em;
      line-height: 1.1;
      color: #fff;
    }

    /* ── Tile grid ─────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 13px;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      min-height: 140px;
      padding: 28px 15px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tile:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,.30);
    }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Numbered index label, top-left — takes the "category" slot from the Alliances tiles */
    .tile .num {
      position: absolute;
      top: 11px;
      left: 13px;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    .tile .nm {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: clamp(14px, 1.85vw, 17px);
      letter-spacing: -.01em;
      line-height: 1.25;
      text-wrap: balance;
    }

    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">

    <header class="home-head">
      <h1>Tools</h1>
    </header>

    <nav class="grid">

      <!-- 1 · Proofpoint Companion ─────────────────────────────── -->
      <a class="tile" href="teacher/">
        <span class="num" aria-hidden="true">01</span>
        <span class="nm">Proofpoint Companion</span>
      </a>

      <!-- 2 · Proofpoint Alliances ─────────────────────────────── -->
      <a class="tile" href="alliances/">
        <span class="num" aria-hidden="true">02</span>
        <span class="nm">Proofpoint Alliances</span>
      </a>

      <!-- 3 · Falcon Presentation ──────────────────────────────── -->
      <a class="tile" href="falcon/">
        <span class="num" aria-hidden="true">03</span>
        <span class="nm">Falcon Presentation</span>
      </a>

      <!-- 4 · Blog Generator ──────────────────────────────────── -->
      <a class="tile" href="blog/">
        <span class="num" aria-hidden="true">04</span>
        <span class="nm">Blog Generator</span>
      </a>

      <!-- 5 · Deck Generator (placeholder — no link yet) ───────── -->
      <div class="tile">
        <span class="num" aria-hidden="true">05</span>
        <span class="nm">Deck Generator</span>
      </div>

      <!-- 6 · Solution Brief Generator (placeholder — no link yet) ─ -->
      <div class="tile">
        <span class="num" aria-hidden="true">06</span>
        <span class="nm">Solution Brief Generator</span>
      </div>

      <!-- 7 · Diagrams Generator (placeholder — no link yet) ───── -->
      <div class="tile">
        <span class="num" aria-hidden="true">07</span>
        <span class="nm">Diagrams Generator</span>
      </div>

      <!-- 8 · Web Content Template Generator (placeholder — no link yet) ─ -->
      <div class="tile">
        <span class="num" aria-hidden="true">08</span>
        <span class="nm">Web Content Template Generator</span>
      </div>

      <!-- 9 · Joint Value Messaging Generator (placeholder — no link yet) ─ -->
      <div class="tile">
        <span class="num" aria-hidden="true">09</span>
        <span class="nm">Joint Value Messaging Generator</span>
      </div>

    </nav>

  </main>
</body>
</html>
