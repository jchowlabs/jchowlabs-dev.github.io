<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>jchowlabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       jchowlabs — home (prototype directory), dark theme.
       A grid of tiles, ported from the Alliances home pattern:
       each tile is a numbered index label (top-left) + a centered
       title. Tiles flow left-to-right, then wrap down — 3 across on
       desktop, 2 on tablet.
       On mobile the grid collapses to a single column of thin, short
       horizontal rows (number circle + title + arrow) — the original
       "list row" look (see the mobile media query below).
       Add one: copy an <a class="tile"> (real page) or a
       <div class="tile"> (not-yet-built placeholder) and bump the number.
       Wire up a placeholder: change its <div class="tile"> to
       <a class="tile" href="…/">.
       ============================================================ */
    :root {
      color-scheme: dark;
      --bg: #1c2230;
      --surface: #252c3d;
      --ink: #e6e8ec;
      --ink-2: #a7b0c2;
      --ink-3: #7c879c;
      --line: #343e52;
      --accent: #5c9ced;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 4px 14px rgba(0,0,0,.18);
      --f-display: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-display);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }

    /* Centered content column (mirrors .wrap in Alliances) */
    .wrap { max-width: 700px; margin-inline: auto; padding: 0 20px 64px; }

    /* ── Header ────────────────────────────────────────────────── */
    .home-head { padding-block: 56px 24px; }
    .home-head h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      font-weight: 700;
      letter-spacing: -.022em;
      line-height: 1.1;
      color: #fff;
    }

    /* ── Tile grid ─────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 13px;
    }

    .tile {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      min-height: 140px;
      padding: 28px 15px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tile:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,.30);
    }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Numbered index label, top-left — takes the "category" slot from the Alliances tiles */
    .tile .num {
      position: absolute;
      top: 11px;
      left: 13px;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    .tile .nm {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: clamp(14px, 1.85vw, 17px);
      letter-spacing: -.01em;
      line-height: 1.25;
      text-wrap: balance;
    }

    /* Arrow only appears in the mobile row layout; hidden in the tile grid. */
    .tile .arrow { display: none; }

    /* ── Mobile: single column of thin, short horizontal rows ──────
       Reverts to the original "list row" look: a numbered circle on the
       left, the title, and a trailing arrow — short height, stacked. */
    @media (max-width: 480px) {
      .wrap { padding: 0 16px 48px; }
      .home-head { padding-block: 40px 18px; }

      .grid { grid-template-columns: 1fr; gap: 12px; }

      .tile {
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 13px;
        text-align: left;
        min-height: 0;
        padding: 11px 16px;
      }

      /* number returns to an inline circle marker on the left */
      .tile .num {
        position: static;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid rgba(230, 232, 236, .45);
        display: grid;
        place-items: center;
        font-size: 12px;
        letter-spacing: 0;
        color: var(--ink);
      }

      .tile .nm {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 15px;
        line-height: 1.3;
      }

      .tile .arrow {
        display: block;
        flex: none;
        width: 18px;
        height: 18px;
        color: var(--ink-3);
        transition: transform .2s ease, color .2s ease;
      }
      .tile:hover .arrow { color: var(--ink); transform: translateX(3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile, .tile .arrow { transition: none; }
    }
  </style>
  <script src="/analytics.js" defer></script>
</head>
<body>
