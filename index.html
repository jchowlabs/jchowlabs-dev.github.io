<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jchowlabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       jchowlabs — home (prototype directory), dark theme
       A "Labs" header over a vertical list of tool rows. Each row is
       a circular badge + title + description + arrow. Add one: copy
       an <a class="card"> block.
       ============================================================ */
    :root {
      color-scheme: dark;
      --ink: #e6e8ec;
      --muted: #98a0b3;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1c2230;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
    }

    .wrap { width: min(900px, 100%); }

    /* ── Header ────────────────────────────────────────────────── */
    .head { text-align: center; margin-bottom: 44px; }
    .head h1 {
      margin: 0;
      font-size: clamp(3rem, 7vw, 4.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      line-height: 1;
    }
    .head p {
      margin: 14px 0 0;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--muted);
    }

    /* ── Vertical list of tool rows ────────────────────────────── */
    .list { display: flex; flex-direction: column; gap: 18px; }

    .card {
      display: flex;
      align-items: center;
      gap: 26px;
      padding: 24px 30px;
      background: rgba(255, 255, 255, .028);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      transition: transform .22s ease, border-color .22s ease, background .22s ease, box-shadow .22s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(120, 170, 240, .40);
      background: rgba(255, 255, 255, .045);
      box-shadow: 0 18px 42px rgba(0, 0, 0, .30);
    }
    .card:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }

    .meta { flex: 1 1 auto; min-width: 0; }
    .meta h2 {
      margin: 0;
      font-size: clamp(1.15rem, 2.6vw, 1.35rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .meta p { margin: 5px 0 0; font-size: clamp(.9rem, 2.2vw, 1rem); color: var(--muted); line-height: 1.45; }

    .arrow { flex: none; width: 22px; height: 22px; color: var(--muted); transition: transform .22s ease, color .22s ease; }
    .card:hover .arrow { color: var(--ink); transform: translateX(4px); }

    /* ── Badge: shared circular motif (colored sphere per tool) ── */
    .badge { width: 76px; height: 76px; border-radius: 50%; flex: none; }
    .sphere {
      display: flex; align-items: center; justify-content: center;
      box-shadow:
        inset 0 -11px 24px rgba(0,0,0,.30),
        inset 6px 6px 13px rgba(255,255,255,.14),
        0 8px 20px rgba(0,0,0,.28),
        0 2px 6px rgba(0,0,0,.16);
    }
    .sphere svg { width: 34px; height: 34px; }

    /* Teacher = blue sphere + open-book glyph */
    .teacher-badge { background: radial-gradient(circle at 38% 30%, #7db2ff 0, #3f6fc9 60%, #2d4f96 100%); }
    /* Falcon = purple sphere + slides glyph */
    .deck-badge { background: radial-gradient(circle at 38% 30%, #9b97f4 0, #5b53c9 62%, #46409e 100%); }
    /* Alliances = teal sphere + linked-partners glyph */
    .alliance-badge { background: radial-gradient(circle at 38% 30%, #3fd0c9 0, #16a394 60%, #0d7f73 100%); }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 560px) {
      body { padding: 40px 16px; }
      .head { margin-bottom: 32px; }
      .card { gap: 18px; padding: 18px 18px; }
      .badge { width: 58px; height: 58px; }
      .sphere svg { width: 27px; height: 27px; }
      .arrow { width: 20px; height: 20px; }
    }
    @media (max-height: 640px) { body { justify-content: flex-start; } }
    @media (prefers-reduced-motion: reduce) {
      .card, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">

    <header class="head">
      <h1>Labs</h1>
      <p>Internal tools and experiments.</p>
    </header>

    <nav class="list">

      <!-- Proofpoint Teacher ─────────────────────────────────────── -->
      <a class="card" href="teacher/">
        <div class="badge sphere teacher-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/>
            <path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="meta">
          <h2>Proofpoint Teacher</h2>
          <p>Teaching and training tools for Proofpoint.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Falcon Deck ────────────────────────────────────────────── -->
      <a class="card" href="falcon/">
        <div class="badge sphere deck-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="1.6"/>
            <path d="M12 16v3"/><path d="M8.5 21h7"/><path d="M6.5 11.5l3-3 2.2 2.2 4-4"/>
          </svg>
        </div>
        <div class="meta">
          <h2>Falcon Deck</h2>
          <p>Presentation and deck tools.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Proofpoint Alliances ───────────────────────────────────── -->
      <a class="card" href="alliances/">
        <div class="badge sphere alliance-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="7" r="2.4" fill="#fff" stroke="none"/>
            <circle cx="18" cy="7" r="2.4" fill="#fff" stroke="none"/>
            <circle cx="12" cy="17.5" r="2.4" fill="#fff" stroke="none"/>
            <path d="M7.7 8.6l3 7"/><path d="M16.3 8.6l-3 7"/><path d="M8.3 7h7.4"/>
          </svg>
        </div>
        <div class="meta">
          <h2>Proofpoint Alliances</h2>
          <p>Alliance tools and resources.</p>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

      <!-- Add the next tool by copying a card block above. -->

    </nav>

  </main>
</body>
</html>
