<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jchowlabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}

/* Layout: fluid plate that fills the window width (capped), centered. Back arrow row, header row, progress bar, stage. Dark only. */
:root{
  --paper:#1B202B; --panel:#222836; --screen:#272E3D; --ink:#E3E8EF; --soft:#8E99AA; --line:#363F51; --grid:#2C3444; --chip:#2F3747;
  --accent:#7F95FF; --accentS:#2D3762; --risk:#FF6A5C; --riskS:#4A2526; --ok:#4CC38A; --onAccent:#12161F; --bezel:#0E1117; --base:#3B4557;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}

body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{box-sizing:border-box;width:100%;max-width:1560px;margin:0 auto;padding-inline:24px;padding-block:16px 20px;display:grid;gap:10px}
@media (max-width:600px){.wrap{padding-inline:16px}}
/* Back-to-home button — subtle circular arrow matching the Alliances page; sits inline in the toolbar. */
.back{display:inline-grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--soft);text-decoration:none;transition:color .2s,border-color .2s}
.back:hover{color:var(--ink);border-color:var(--soft)}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
h1{margin:0;font:700 40px/1 var(--f-display);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:transparent;color:var(--soft);font:600 13px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button.b[aria-pressed="true"]{background:var(--risk);color:var(--onAccent)}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.btn{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent);min-width:76px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stepno{font:500 12px var(--f-mono);color:var(--soft);letter-spacing:.06em;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.bar.b i{background:var(--risk)}
.stage{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stage svg{display:block;width:100%;min-width:980px;height:auto}
.cap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:8px 28px;align-items:baseline;padding-block:4px}
@media (max-width:760px){.cap{grid-template-columns:1fr}}
.cap h2{margin:0;font:700 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.cap p{margin:0;max-width:78ch;color:var(--soft)}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.foot{margin:0;font-size:12.5px;color:var(--soft)}

/* svg */
svg text{font-family:var(--f-body);fill:var(--ink)}
svg .mono{font-family:var(--f-mono)}
.gridline{stroke:var(--grid);fill:none}
.colhd{font:600 11px var(--f-mono);letter-spacing:.12em;fill:var(--soft)}
.ts{fill:var(--soft)} .ta{fill:var(--accent)} .tr{fill:var(--risk)} .tok{fill:var(--ok)} .tw{fill:var(--onAccent)}
.card{fill:var(--screen);stroke:var(--line)}
.pnl{fill:var(--panel);stroke:var(--line)}
.bezel{fill:var(--bezel)} .screen{fill:var(--screen)} .base{fill:var(--base)} .chrome{fill:var(--chip)}
.bubble{fill:var(--chip)} .skel{fill:var(--chip)}
.boundary{stroke:var(--soft);stroke-width:1.2;stroke-dasharray:7 6}
.chip{fill:var(--panel);stroke:var(--line);transition:fill .3s,stroke .3s}
.chip.on{fill:var(--accent);stroke:var(--accent)}
.chipt{font-size:11px;font-weight:600;fill:var(--soft)} .chip.on+.chipt{fill:var(--onAccent)}
.ring-outer{fill:none;stroke:var(--line)}
.tick{stroke:var(--line)}
.wheel{fill:none;stroke:var(--ink);stroke-width:2}
.hub{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.mode-b .arc{stroke:var(--risk)}
.arcs{transform-box:view-box;transform-origin:675px 565px}
.arcs.spin{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stn{fill:var(--panel);stroke:var(--ink);stroke-width:2;transition:all .3s}
.stn.on{fill:var(--accent);stroke:var(--accent)}
.mode-b .stn.on{fill:var(--risk);stroke:var(--risk)}
.stnl{font-size:12.5px;fill:var(--soft)} .stnl.on{fill:var(--accent);font-weight:700}
.mode-b .stnl.on{fill:var(--risk)}
.tile{fill:var(--grid);transition:fill .25s}
.tile.scan{fill:var(--accentS)}
.tile.hit{fill:var(--accent)}
.tile.sec-a{fill:var(--soft)}
.tile.sec-b{fill:var(--risk)}
.minitile{fill:var(--grid)}
.minitile.lit{fill:var(--accent)}
.scanband{fill:none;stroke:var(--accent);stroke-width:1.5}
.flow{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;animation:dash 1s linear infinite}
.flow.k-req,.flow.k-data,.flow.k-ans{stroke:var(--accent)}
.flow.k-risk{stroke:var(--risk);stroke-width:3}
@keyframes dash{to{stroke-dashoffset:-14}}
.pk{fill:var(--accent)} .pk.k-risk{fill:var(--risk)}
.pkh{fill:var(--accent);opacity:.22} .pkh.k-risk{fill:var(--risk)}
.trayt{fill:var(--accentS);stroke:var(--accent)}
.trayt.risk{fill:var(--riskS);stroke:var(--risk);stroke-width:2}
.pop{animation:pop .45s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#secG{opacity:0;transition:opacity .3s}
#secG.shown{opacity:1}
.tray{fill:var(--screen);stroke:var(--line)}
.tray.alert{stroke:var(--risk);stroke-width:1.6}
.ahabg{fill:var(--riskS)}
.callout-a{fill:var(--panel);stroke:var(--line)}
.callout-b{fill:var(--riskS);stroke:var(--risk)}
.secring-a{fill:none;stroke:var(--soft);stroke-width:1.6}
.secring-b{fill:none;stroke:var(--risk);stroke-width:1.6}
.lead-a{stroke:var(--soft)} .lead-b{stroke:var(--risk)}
.okcard{fill:var(--screen);stroke:var(--ok);stroke-width:1.5}
.banner{fill:var(--risk)}
.caret{fill:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.spinner{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-dasharray:38 20;transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.sendbtn{fill:var(--accent)}
.docicon{fill:var(--screen);stroke:var(--soft)} .docline{stroke:var(--soft);stroke-width:1.4}
.lockb{fill:var(--soft)} .lockr{fill:none;stroke:var(--soft);stroke-width:1.6}
@media (prefers-reduced-motion: reduce){
  .arcs.spin,.flow,.spinner,.caret,.pop{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="../" aria-label="Back to home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="ctrls">
      <button type="button" class="btn" id="restart">Restart</button>
      <button type="button" class="btn primary" id="play">Pause</button>
    </div>
  </div>
  <div class="bar" id="bar"><i></i></div>

  <figure class="stage" style="margin:0">
    <svg id="svg" viewBox="0 0 1376 688" role="img" aria-label="Animated diagram: a prompt on a laptop goes to an AI agent, which loops through tool calls into CRM, ERP, Drive and Email, then returns an answer"></svg>
  </figure>

  <div class="sr-only" aria-live="polite">
    <h2 id="ctitle"></h2>
    <p id="cbody"></p>
  </div>
  </div>

<script>
(function(){
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function e(tag,a,p,txt){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);if(txt!=null)n.textContent=txt;(p||svg).appendChild(n);return n}
function g(cls,p){return e('g',cls?{class:cls}:{},p)}
function wrap(t,n){const w=t.split(' '),r=[];let c='';w.forEach(x=>{if(c&&(c+' '+x).length>n){r.push(c);c=x}else c=c?c+' '+x:x});r.push(c);return r}

/* ---------- geometry ---------- */
const TY=388, slotX=i=>458+i*88, slotC=i=>slotX(i)+40;
/* systems: three equal, scannable grids (narrower + shifted right, leaving room for the flow lines) */
const SX0=1000, SW=352, SH=156, SGAP=12;
const CARDY={crm:52, erp:52+SH+SGAP, drive:52+2*(SH+SGAP)};
const GCOLS=26, GCW=12, GCH=13, GROWS=8, GX0=SX0+20;
const gy0=k=>CARDY[k]+40;
const tc=(k,r,c)=>[GX0+c*GCW+(GCW-3)/2, gy0(k)+r*GCH+(GCH-3)/2];
const HITS={crm:[[1,4],[3,17],[5,9],[6,21]], erp:[[0,7],[2,19],[4,2],[6,13]], drive:[[1,5],[3,20],[5,2],[6,18]]};
const SEC=[4,19], PLAN=[1,5], SCANSTEP={crm:4, erp:6, drive:7};
const HUBY=276;  // the conversation box is the hub — flow lines leave/arrive at this height
const P={
  lap:`M346 188 C 400 188, 410 ${HUBY}, 440 ${HUBY}`,
  sys:k=>`M910 ${HUBY} C 948 ${HUBY}, 948 ${CARDY[k]+SH/2}, ${SX0} ${CARDY[k]+SH/2}`,
  back:(k,i)=>`M${SX0} ${CARDY[k]+SH/2} C 948 ${CARDY[k]+SH/2}, 948 ${TY+59}, 912 ${TY+59} L ${slotC(i)} ${TY+59}`,
  file:(rc,i)=>{const [x,y]=tc('drive',rc[0],rc[1]);return `M${x} ${y} C ${x-160} ${y}, 948 ${TY+59}, 912 ${TY+59} L ${slotC(i)} ${TY+59}`}
};

/* ---------- static scene ---------- */
const defs=e('defs',{});const pat=e('pattern',{id:'gp',width:24,height:24,patternUnits:'userSpaceOnUse'},defs);e('path',{d:'M24 0H0V24',class:'gridline'},pat);
e('rect',{width:1376,height:688,fill:'url(#gp)'});
e('text',{x:40,y:34,class:'colhd'},null,'1 · YOUR LAPTOP');
e('text',{x:440,y:34,class:'colhd'},null,'2 · THE AGENT');
e('text',{x:964,y:34,class:'colhd'},null,'3 · YOUR SYSTEMS');
e('line',{x1:930,y1:20,x2:930,y2:678,class:'boundary'});
e('text',{x:946,y:674,class:'colhd',transform:'rotate(-90 946 674)','font-size':10},null,'CONNECTORS · YOUR CREDENTIALS');

// laptop (grouped so the whole thing can be nudged up to align with the other columns)
const laptopG=g();laptopG.setAttribute('transform','translate(40,80) scale(0.9) translate(-40,-150)');
e('rect',{x:40,y:150,width:340,height:286,rx:14,class:'bezel'},laptopG);
e('rect',{x:52,y:162,width:316,height:262,rx:4,class:'screen'},laptopG);
e('path',{d:'M14 436 H406 L392 456 H28 Z',class:'base'},laptopG);
e('rect',{x:52,y:162,width:316,height:28,class:'chrome'},laptopG);
[0,1,2].forEach(i=>e('circle',{cx:66+i*12,cy:176,r:4,class:'skel',style:'fill:var(--line)'},laptopG));
e('text',{x:210,y:180,'font-size':11,'font-weight':600,class:'ts','text-anchor':'middle'},laptopG,'Claude');
e('rect',{x:62,y:380,width:296,height:34,rx:10,class:'pnl'},laptopG);
const lapG=g(null,laptopG);

// thinking panel
const convBox=e('rect',{x:440,y:52,width:470,height:448,rx:8,class:'tray'});
e('text',{x:458,y:77,class:'colhd'},null,'CONVERSATION');
e('line',{x1:456,x2:894,y1:TY+2,y2:TY+2,class:'tick'});
e('text',{x:626,y:77,'font-size':11,class:'ts','text-anchor':'end'},null,'Tools');
const TOOLS=['Email','CRM','ERP','Drive'];const chips={};let tx=636;
TOOLS.forEach(t=>{const w=t.length*7.5+22;chips[t]=e('rect',{x:tx,y:62,width:w,height:21,rx:10.5,class:'chip'});e('text',{x:tx+w/2,y:77,class:'chipt','text-anchor':'middle'},null,t);tx+=w+6});
const thinkG=g();

// (the model "wheel" was removed — the agent conversation box is now the hub for every flow line)

// tray
e('text',{x:458,y:TY+24,class:'colhd'},null,'IN CONTEXT · EVERYTHING THE MODEL HAS READ');
const trayG=g();

// systems — three equal, scannable grids
const SYSDEF=[['crm','CRM','accounts · opportunities'],['erp','ERP','budgets · actuals'],['drive','Drive','1,240 files · shared across Acme']];
const grids={},scanBands={};
function sys(k,name,sub){const y=CARDY[k],g0=gy0(k);
  e('rect',{x:SX0,y,width:SW,height:SH,rx:8,class:'card'});
  e('text',{x:SX0+18,y:y+24,'font-size':13,'font-weight':700},null,name);
  e('text',{x:SX0+SW-16,y:y+24,'font-size':11,class:'ts','text-anchor':'end'},null,sub);
  grids[k]=[];for(let r=0;r<GROWS;r++){grids[k].push([]);for(let c=0;c<GCOLS;c++)grids[k][r].push(e('rect',{x:GX0+c*GCW,y:g0+r*GCH,width:GCW-3,height:GCH-3,rx:1.5,class:'tile'}))}
  scanBands[k]=e('rect',{x:GX0-5,y:g0,width:GCOLS*GCW+4,height:GCH+3,rx:3,class:'scanband',opacity:0});
}
SYSDEF.forEach(d=>sys(d[0],d[1],d[2]));
// sensitive file marker + callout (Drive)
const [SX,SY]=tc('drive',SEC[0],SEC[1]);
const secG=g();secG.id='secG';
const secRing=e('circle',{cx:SX,cy:SY,r:9},secG);
const CB=CARDY.drive+SH+10;const lead=e('line',{x1:SX,y1:SY+9,x2:SX,y2:CB,'stroke-width':1},secG);
const callBox=e('rect',{x:SX0+8,y:CB,width:320,height:84,rx:6},secG);
e('text',{x:SX0+24,y:CB+22,'font-size':12.5,'font-weight':700,id:'cfn'},secG,'Workforce Plan 2027.xlsx');
e('text',{x:SX0+24,y:CB+40,'font-size':11.5},secG,'Planned layoffs · names · salaries');
const callL1=e('text',{x:SX0+24,y:CB+59,'font-size':11.5,'font-weight':700},secG);
const callL2=e('text',{x:SX0+24,y:CB+75,'font-size':11,class:'ts'},secG);
const skipLbl=e('text',{x:SX,y:SY-14,'font-size':10.5,'font-weight':600,class:'ts','text-anchor':'middle',opacity:0},null,'locked · skipped');

const fx=g();      // flows
const pkG=g();    // packets
const vG=g();     // verdicts

/* ---------- script ---------- */
const S=[
{t:'You ask',b:'Someone types a request into Claude. From here until the answer, the chat window is all they see.',status:null,type:1,dur:3200},
{t:'The request reaches the model',b:'The prompt leaves the laptop for the model provider. The model reads it and starts reasoning about what to do.',
 think:[['GOAL','A strategy doc for next year’s expansion.']],wheel:'think',status:'Thinking',tray:['prompt'],pk:[{d:P.lap,k:'req'}]},
{t:'It checks its tools',b:'Each connected system shows up as a tool the model can ask for. The model can’t open anything itself. It can only request these tools.',
 think:[['TOOLS','What can I use? Email, CRM, ERP and Drive.']],wheel:'think',status:'Thinking',chipsSeq:1},
{t:'It makes a plan',b:'The goal turns into a short list of things to find. Each one will take at least one turn of the wheel.',
 think:[['NEED','Pipeline, budget, last year’s plan, team size.']],wheel:'think',status:'Planning'},
{t:'Use a tool',b:'The model writes a tool request. A connector runs it against the CRM using the user’s own credentials.',
 think:[['CALL','crm.search “open opportunities, new markets”']],wheel:'tool',chip:'CRM',status:'Reading CRM',turn:1,pk:[{d:P.sys('crm'),k:'req'}],scan:'crm'},
{t:'Read the result',b:'The records come back and land in the context. The model decides what matters and moves on.',
 think:[['KEEP','312 records. Keeping the top 20 by value.']],wheel:'read',chip:'CRM',status:'Reading CRM',turn:1,tray:['crm'],pk:[{d:P.back('crm',1),k:'data',file:1}]},
{t:'Another turn for the budget',b:'Same loop, different system. Think, use a tool, read the result.',
 think:[['CALL','erp.query “2026 budget vs actual”'],['KEEP','Spend is $6.8M of a $7.5M budget.']],wheel:'read',chip:'ERP',status:'Reading ERP',turn:2,tray:['erp'],
 pk:[{d:P.sys('erp'),k:'req'},{d:P.back('erp',2),k:'data',file:1,delay:1600}],scan:'erp',dur:4800},
{t:'Searching a big repository',b:{a:'Drive holds 1,240 files. The search sweeps through them and returns whatever matches. The HR file is restricted, so it never comes back.',
  b:'Drive holds 1,240 files. The search sweeps through them and returns whatever matches. The HR file was shared with all of Acme by mistake, so it matches like anything else.'},
 think:[['CALL','drive.search “expansion plan headcount”']],wheel:'tool',chip:'Drive',status:'Searching Drive',turn:3,pk:[{d:P.sys('drive'),k:'req'}],scan:'drive',dur:5600},
{t:{a:'It reads what matched',b:'The innocuous read'},b:{a:'The agent opens last year’s plan. That’s the only file worth reading here.',
  b:'The agent opens the HR file for the same reason it opened the plan: it matched the search. Nothing about this step is malicious.'},
 think:[['READ','2026 Growth Plan.docx','a'],['READ','2026 Growth Plan.docx, Workforce Plan 2027.xlsx','b']],wheel:'read',chip:'Drive',status:'Searching Drive',turn:3,
 tray:['plan','secret'],pk:[{d:P.file(PLAN,3),k:'data',file:1},{d:P.file(SEC,4),k:'risk',file:1,delay:500,mode:'b'}],dur:4600},
{t:{a:'It sorts what it found',b:'The aha'},b:{a:'Useful files stay in the context. Everything else is ignored.',
  b:'The agent does the right thing and leaves the file out. But it could only recognize the file by reading it. The contents are already in its context.'},
 think:[['KEEP','Last year’s plan is useful. Skipping 1,239 others.','a'],['KEEP','Last year’s plan is useful.','b'],
  ['AHA','This lists planned layoffs with names and salaries. It’s confidential and not needed for a strategy doc. I’ll leave it out.','b']],
 wheel:'think',status:'Searching Drive',turn:3,dur:{a:4200,b:7600}},
{t:'Enough to answer',b:'No more tool requests. That’s how the loop knows it’s finished.',
 think:[['DONE','I have enough. Writing the doc.']],wheel:'think',status:'Writing'},
{t:'The answer comes back',b:{a:'The draft lands in the same chat window where the request started.',
  b:'Same draft, and nothing sensitive in it. From the user’s side, this run looks exactly like the normal one.'},
 answer:1,pk:[{d:P.lap,k:'ans',rev:1}],dur:4600},
{t:{a:'How an agent works',b:'A clean answer, and a hidden exposure'},b:{a:'A prompt goes in. The agent loops through think, use a tool, read the result until it has enough. The answer comes out. Three tools, three turns of the wheel.',
  b:'The confidential file went to the model provider and stayed in the agent’s context for the rest of the task. Nothing in the answer reveals it, so nobody would think to look.'},
 answer:1,final:1}
];
const N=S.length;
const pick=(v,m)=>v&&typeof v==='object'&&!Array.isArray(v)&&('a' in v||'b' in v)?v[m]:v;
const PROMPT='Put together a strategy doc for our expansion next year.';
const SLOTS={prompt:['prompt','you',0],crm:['CRM','312 rec',1],erp:['ERP','48 rows',2],plan:['Plan','.docx',3],secret:['Workforce','HR · names',4]};

/* ---------- state ---------- */
let mode='b',cur=0,playing=!reduce,t0=performance.now(),anims=[],packets=[];

function cumulative(n){
  const lines=[],tray=[];let turn=0;
  for(let i=0;i<=n;i++){const s=S[i];
    (s.think||[]).forEach(l=>{if(!l[2]||l[2]===mode)lines.push({tag:l[0],text:l[1],step:i})});
    (s.tray||[]).forEach(k=>{if(k!=='secret'||mode==='b')tray.push({k,step:i})});
    if(s.turn)turn=s.turn;}
  return {lines,tray,turn};
}

function render(n){
  const s=S[n],c=cumulative(n),B=mode==='b';
  svg.classList.toggle('mode-b',B);
  anims=[];packets=[];
  const now=performance.now();

  /* laptop */
  lapG.innerHTML='';
  if(n===0){
    const tt=e('text',{x:76,y:402,'font-size':12.5},lapG);
    const caret=e('rect',{x:76,y:391,width:1.5,height:15,class:'caret'},lapG);
    e('circle',{cx:342,cy:397,r:10,class:'sendbtn'},lapG);e('path',{d:'M337 397 h9 M342 392 l5 5 -5 5',style:'stroke:var(--onAccent);fill:none;stroke-width:1.8'},lapG);
    const short='Put together a strategy doc for our expansion…';
    anims.push(el=>{const k=reduce?short.length:Math.min(short.length,Math.floor(Math.max(0,el-300)/45));tt.textContent=short.slice(0,k);caret.setAttribute('x',76+tt.getComputedTextLength()+2)});
  }else{
    e('text',{x:76,y:402,'font-size':12.5,class:'ts'},lapG,'Reply…');
    e('rect',{x:146,y:204,width:208,height:62,rx:12,class:'bubble'},lapG);
    wrap(PROMPT,26).forEach((t,i)=>e('text',{x:160,y:226+i*15,'font-size':12.5},lapG,t));
    if(!s.answer){
      e('circle',{cx:74,cy:296,r:8,class:'spinner'},lapG);
      e('text',{x:92,y:300,'font-size':12.5,class:'ts'},lapG,'Working…  '+(s.status||'').toLowerCase());
      [0,1,2].forEach(i=>e('rect',{x:66,y:322+i*20,width:[260,220,180][i],height:9,rx:4,class:'skel'},lapG));
    }else{
      e('text',{x:66,y:296,'font-size':12.5},lapG,'Here’s your draft strategy.');
      e('rect',{x:66,y:306,width:288,height:60,rx:8,class:'pnl'},lapG);
      e('rect',{x:80,y:318,width:28,height:36,rx:3,class:'docicon'},lapG);
      [328,336,344].forEach(y=>e('line',{x1:86,x2:102,y1:y,y2:y,class:'docline'},lapG));
      e('text',{x:120,y:331,'font-size':13,'font-weight':700},lapG,'Expansion Strategy 2027');
      e('text',{x:120,y:348,'font-size':11.5,class:'ts'},lapG,'Draft · 6 pages');
    }
  }

  /* chips */
  TOOLS.forEach((t,i)=>{let on=s.chip===t;chips[t].classList.toggle('on',on)});
  if(s.chipsSeq){if(reduce)TOOLS.forEach(t=>chips[t].classList.add('on'));else anims.push(el=>TOOLS.forEach((t,i)=>chips[t].classList.toggle('on',el>700+i*450)))}

  /* thinking feed: last 3 lines of the current run */
  thinkG.innerHTML='';
  const vis=c.lines.slice(-4);
  if(c.lines.length>4)e('text',{x:458,y:106,'font-size':11,class:'ts mono',opacity:.6},thinkG,'· · · earlier steps');
  let y=134;const ops=[[1],[.65,1],[.4,.7,1],[.3,.5,.75,1]][vis.length-1]||[];
  vis.forEach((l,i)=>{
    const newest=i===vis.length-1&&l.step===n, risk=l.tag==='AHA';
    const lg=g(null,thinkG);lg.setAttribute('opacity',ops[i]);
    const rows=wrap(l.text,50);
    if(risk)e('rect',{x:448,y:y-18,width:454,height:rows.length*18+12,rx:6,class:'ahabg'},lg);
    e('text',{x:458,y,'font-size':10.5,'font-weight':600,class:'mono '+(risk?'tr':(l.tag==='KEEP'||l.tag==='DONE'?'ta':'ts'))},lg,l.tag);
    const els=rows.map((t,j)=>e('text',{x:516,y:y+j*18,'font-size':13.5,'font-weight':ops[i]===1?600:400,class:l.tag==='CALL'?'mono':''},lg,t));
    if(l.tag==='CALL')els.forEach(x=>x.setAttribute('font-size',12.5));
    if(newest&&!reduce){const total=l.text.length,start=l.tag==='AHA'?600:250,speed=l.tag==='AHA'?32:22;
      els.forEach(x=>x.textContent='');
      anims.push(el=>{let k=Math.floor(Math.max(0,el-start)/speed);rows.forEach((r,j)=>{const take=Math.max(0,Math.min(r.length,k));els[j].textContent=r.slice(0,take);k-=r.length+1})});}
    y+=rows.length*18+14;
  });

  /* system grids + scan — CRM, ERP and Drive all comb through the same way */
  const setGrid=(k,row)=>{const hits=HITS[k];for(let r=0;r<GROWS;r++)for(let cc=0;cc<GCOLS;cc++){
    const t=grids[k][r][cc];let cls='tile';const isHit=hits.some(h=>h[0]===r&&h[1]===cc),isSec=k==='drive'&&r===SEC[0]&&cc===SEC[1];
    if(row>=0&&r===Math.floor(row)&&row<GROWS)cls+=' scan';
    if(row>=0&&r<row){if(isHit)cls+=' hit';if(isSec&&B)cls+=' sec-b';}
    t.setAttribute('class',cls)}};
  SYSDEF.forEach(d=>{const k=d[0],ss=SCANSTEP[k];setGrid(k,n>ss?GROWS:(n===ss?0:-1));scanBands[k].setAttribute('opacity',0)});
  skipLbl.setAttribute('opacity',0);
  const revealed=B&&(n>SCANSTEP.drive||(n===SCANSTEP.drive&&reduce));secG.setAttribute('class',revealed?'shown':'');
  if(s.scan){const k=s.scan,g0=gy0(k);
    if(reduce)setGrid(k,GROWS);
    else anims.push(el=>{const row=Math.max(0,(el-700)/2600*GROWS);setGrid(k,Math.min(row,GROWS));
      scanBands[k].setAttribute('opacity',row<GROWS?1:0);
      const by=g0+Math.min(Math.floor(row),GROWS-1)*GCH-2;scanBands[k].setAttribute('y',by);
      if(k==='drive'&&B&&row>SEC[0]+1&&!secG.classList.contains('shown')){secG.classList.add('shown','pop');secG.style.animationDelay='0ms'}});
  }
  // callout per mode
  secRing.setAttribute('class',B?'secring-b':'secring-a');lead.setAttribute('class',B?'lead-b':'lead-a');callBox.setAttribute('class',B?'callout-b':'callout-a');
  document.getElementById('cfn').setAttribute('class',B?'tr':'');
  callL1.textContent=B?'Shared: anyone at Acme':'Restricted: HR leadership only';callL1.setAttribute('class',B?'tr':'tok');
  callL2.textContent=B?'Over-permissioned, so search can reach it':'The agent’s search can’t return it';

  /* tray */
  trayG.innerHTML='';
  c.tray.forEach(({k,step})=>{const [lab,sub,i]=SLOTS[k],x=slotX(i),isR=k==='secret';
    const tg=g(step===n&&!reduce?'pop':null,trayG);
    if(step===n&&!reduce){const pk=(s.pk||[]).find(p=>p.file&&(p.d===P.file(SEC,4)?isR:!isR))||(s.pk||[])[0];const delay=(pk?(pk.delay||0)+1500:0);tg.style.animationDelay=delay+'ms'}
    e('rect',{x,y:TY+36,width:80,height:46,rx:5,class:'trayt'+(isR?' risk':'')},tg);
    e('text',{x:x+8,y:TY+56,'font-size':11.5,'font-weight':600,class:isR?'tr':''},tg,lab);
    e('text',{x:x+8,y:TY+72,'font-size':10,class:'ts mono'},tg,sub);});
  const trayAlert=B&&n>=9;
  convBox.setAttribute('class','tray'+(trayAlert?' alert':''));
  if(trayAlert)e('text',{x:458,y:TY+101,'font-size':11,'font-weight':600,class:'tr'},trayG,'Excluded from the answer. Still in the context the model read.');

  /* flows + packets */
  fx.innerHTML='';pkG.innerHTML='';
  (s.pk||[]).forEach(p=>{if(p.mode&&p.mode!==mode)return;
    e('path',{d:p.d,class:'flow k-'+p.k},fx);
    if(reduce)return;
    const path=e('path',{d:p.d,fill:'none',stroke:'none'},pkG);
    const halo=e('circle',{r:11,class:'pkh k-'+p.k,opacity:0},pkG);
    const dot=p.file?e('rect',{width:12,height:14,rx:2,class:'pk k-'+p.k,opacity:0},pkG):e('circle',{r:6,class:'pk k-'+p.k,opacity:0},pkG);
    packets.push({path,len:path.getTotalLength(),halo,dot,file:p.file,delay:p.delay||0,dur:p.dur||1500,rev:!!p.rev});
  });

  /* verdicts */
  vG.innerHTML='';
  if(s.final){
    if(!B){e('rect',{x:40,y:536,width:340,height:62,rx:8,class:'okcard'},vG);
      e('text',{x:58,y:562,'font-size':13,'font-weight':700,class:'tok'},vG,'✓  Answer delivered');
      e('text',{x:58,y:582,'font-size':12,class:'ts'},vG,'3 tools · 3 turns · nothing sensitive touched');}
    else{e('rect',{x:40,y:360,width:340,height:62,rx:8,class:'okcard'},vG);
      e('text',{x:58,y:386,'font-size':13,'font-weight':700,class:'tok'},vG,'✓  In the answer: nothing sensitive');
      e('text',{x:58,y:406,'font-size':12,class:'ts'},vG,'This is all the user ever sees.');
      const bg=g(reduce?null:'pop',vG);
      e('rect',{x:440,y:520,width:470,height:46,rx:8,class:'banner'},bg);
      e('text',{x:458,y:548,'font-size':14,'font-weight':700,class:'tw'},bg,'⚠  Seen by the model: yes. Hidden exposure.');}
  }

  /* chrome */
  document.getElementById('ctitle').textContent=pick(s.t,mode);
  document.getElementById('cbody').textContent=pick(s.b,mode);
  const bar=document.getElementById('bar');bar.classList.toggle('b',B);bar.firstElementChild.style.width=((n+1)/N*100)+'%';
  t0=now;
}

/* ---------- controls ---------- */
const playBtn=document.getElementById('play');
function setPlaying(v){playing=v;playBtn.textContent=v?'Pause':'Play';t0=performance.now()}
function go(n){cur=Math.max(0,Math.min(N-1,n));render(cur)}
playBtn.onclick=()=>{if(!playing&&cur===N-1)go(0);setPlaying(!playing)};
document.getElementById('restart').onclick=()=>{go(0);setPlaying(true)};

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tick(now){
  const el=now-t0;
  anims.forEach(f=>f(el));
  packets.forEach(p=>{const t=(el-p.delay)/p.dur;
    if(t<0||t>1){p.dot.setAttribute('opacity',0);p.halo.setAttribute('opacity',0);return}
    const pt=p.path.getPointAtLength((p.rev?1-ease(t):ease(t))*p.len);
    if(p.file){p.dot.setAttribute('x',pt.x-6);p.dot.setAttribute('y',pt.y-7)}else{p.dot.setAttribute('cx',pt.x);p.dot.setAttribute('cy',pt.y)}
    p.halo.setAttribute('cx',pt.x);p.halo.setAttribute('cy',pt.y);p.dot.setAttribute('opacity',1);p.halo.setAttribute('opacity',1)});
  const dur=pick(S[cur].dur,mode)||4200;
  if(playing&&el>dur){if(cur<N-1)go(cur+1);else setPlaying(false)}
  requestAnimationFrame(tick);
}
setPlaying(playing);go(0);requestAnimationFrame(tick);

/* fit the whole plate inside the visible window; never upscale, scroll below 60% */
const wrapEl=document.querySelector('.wrap');
function fit(){wrapEl.style.zoom=1;const w=wrapEl.offsetWidth,h=wrapEl.offsetHeight;
  const z=Math.max(.6,Math.min(1,window.innerWidth/w,window.innerHeight/h));wrapEl.style.zoom=z}
fit();window.addEventListener('resize',fit);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
</script>
</body>
