<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jchowlabs</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Back to the directory -->
  <a class="home-link" href="../" aria-label="Back to jchowlabs">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
  </a>

  <main class="chat">
    <header class="topbar">
      <h1>Blog Generator</h1>
      <button id="newBtn" class="ghost-btn" type="button">New blog</button>
    </header>

    <!-- =========================================================
         Conversation thread.
         Seeded with ONE static assistant greeting — that's the whole
         "illusion": the AI appears to greet you the moment the page
         loads (app.js plays a short typing → greeting entrance). Nothing
         else happens until the user submits. The live model, voice, and
         real .docx export are wired up in later phases.
         ========================================================= -->
    <div id="thread" class="thread">

      <!-- greeting — the only pre-seeded message. "New blog" resets here. -->
      <div class="turn assistant" id="greeting">
        <div class="avatar" aria-hidden="true"></div>
        <div class="content">
          <p>Hi — I'll help you draft a <strong>Proofpoint blog</strong>. Answer a few quick questions and I'll put together a first draft you can refine right here.</p>
          <p>To start: <strong>what are you announcing, and is there a partner involved?</strong></p>
        </div>
      </div>

    </div>

    <!-- composer -->
    <form id="composer" class="composer" autocomplete="off">
      <button id="micBtn" class="mic-btn" type="button" aria-label="Dictate (coming soon)" title="Voice input — coming soon">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11v1a7 7 0 0 0 14 0v-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <textarea id="input" class="input" rows="1" placeholder="Answer here — or describe what you're announcing…"></textarea>
      <button id="sendBtn" class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
