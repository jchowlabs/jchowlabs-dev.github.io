<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jchowlabs</title>
    <link rel="stylesheet" href="styles.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Back-to-home arrow — inlined (not in styles.css) so it can't be served stale from cache. Same design as Falcon/Alliances. */
      .home-link{position:fixed;top:18px;left:18px;z-index:10;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#9aa4b6;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);transition:color .2s ease,background .2s ease,border-color .2s ease}
      .home-link:hover{color:#e6e8ec;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14)}
      .home-link svg{width:18px;height:18px}
    </style>
</head>
<body>
    <!-- Back to the directory -->
    <a class="home-link" href="../" aria-label="Back to jchowlabs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></svg>
    </a>

    <main class="stage">
        <div class="demo-center">
            <!-- Orb (decorative) -->
            <div class="playground-orb-wrap">
                <div class="value-demo-orb" aria-hidden="true">
                    <div class="orb-inner">
                        <div class="orb-blob orb-blob-1"></div>
                        <div class="orb-blob orb-blob-2"></div>
                        <div class="orb-blob orb-blob-3"></div>
                        <div class="orb-blob orb-blob-4"></div>
                        <div class="orb-blob orb-blob-5"></div>
                        <div class="orb-shine"></div>
                        <div class="orb-grain"></div>
                    </div>
                </div>
            </div>

            <!-- Voice session call button: phone (idle) → spinner (connecting) → red end-call (active) -->
            <button id="voice-btn" class="call-btn" type="button" data-status="idle" aria-label="Start call">
                <svg class="call-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
                </svg>
                <span class="call-spinner" aria-hidden="true"></span>
            </button>
        </div>
    </main>

    <script src="/analytics.js" defer></script>
    <script src="app.js?v=1"></script>
</body>
</html>
